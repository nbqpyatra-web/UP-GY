    <script>
      (function () {
        var FID = "11-every-pincode";
        var NS = "http://www.w3.org/2000/svg";
        var data = window.UP_DISTRICTS;
        var list = (data && data.districts) ? data.districts.slice().sort(function (a, b) { return a.order - b.order; }) : [];
        function $(id) { return document.getElementById(id); }

        // faint lit-map watermark: all 75 districts in cream
        var gD = $("f11-districts");
        list.forEach(function (d) {
          var p = document.createElementNS(NS, "path");
          p.setAttribute("d", d.d);
          p.setAttribute("class", "f11-dist");
          gD.appendChild(p);
        });

        // odometer: deterministic pincode-style sequence
        var SEQ = ["273001", "243001", "274401", "244001", "273303"];
        var FILL = 3;            // rolling filler digits between states
        var H = 145;             // digit row height
        var odo = $("f11-odo");
        var strips = [];
        var stops = [];          // per column: strip index of each state
        for (var c = 0; c < 6; c++) {
          var cell = document.createElement("div");
          cell.className = "f11-cell";
          cell.style.left = (c * 109.6) + "px";
          var strip = document.createElement("div");
          strip.className = "f11-strip";
          strip.id = "f11-strip-" + c;
          var digits = [];
          var st = [];
          for (var s = 0; s < SEQ.length; s++) {
            var v = parseInt(SEQ[s].charAt(c), 10);
            if (s > 0) {
              var prev = parseInt(SEQ[s - 1].charAt(c), 10);
              for (var k = 1; k <= FILL; k++) digits.push((prev + k * 3 + c) % 10);
            }
            st.push(digits.length);
            digits.push(v);
          }
          digits.forEach(function (dg) {
            var sp = document.createElement("span");
            sp.className = "f11-dig";
            sp.textContent = String(dg);
            strip.appendChild(sp);
          });
          cell.appendChild(strip);
          odo.appendChild(cell);
          strips.push(strip);
          stops.push(st);
        }

        var tl = gsap.timeline({ paused: true });

        // watermark + quiet push-in underneath (moves once, then rests)
        tl.fromTo("#f11-map", { opacity: 0 }, { opacity: 0.08, duration: 0.5, ease: "power2.out" }, 0);
        tl.fromTo("#f11-stage", { scale: 1.0 }, { scale: 1.035, duration: 6.4, ease: "power2.inOut" }, 0);
        tl.fromTo("#f11-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.05);

        // Scene 1-3: slams on the voice
        function slam(sel, t) {
          tl.fromTo(sel,
            { opacity: 0, scale: 1.7, x: -40, filter: "blur(14px)" },
            { opacity: 1, scale: 1, x: 0, filter: "blur(0px)", duration: 0.38, ease: "expo.out" }, t);
        }
        slam("#f11-l1", 0.10);
        slam("#f11-l2", 1.70);
        slam("#f11-l3", 3.35);

        // odometer arrives beside line 3, then rolls through states and settles
        tl.fromTo("#f11-odo", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.45);
        var T0 = 3.55, STEP = 0.32;
        strips.forEach(function (strip, c) {
          for (var s = 1; s < SEQ.length; s++) {
            var last = (s === SEQ.length - 1);
            tl.to(strip, {
              y: -stops[c][s] * H,
              duration: last ? 0.42 : 0.26,
              ease: last ? "power3.out" : "power1.inOut"
            }, T0 + (s - 1) * STEP + c * 0.03);
          }
        });

        // Scene 4: pill rises on "पूरे", 75 pops on "पचहत्तर", then hold
        tl.fromTo("#f11-pill", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.19);
        tl.fromTo("#f11-num", { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "back.out(2.4)" }, 5.66);

        window.__timelines = window.__timelines || {};
        window.__timelines[FID] = tl;
      })();
